events:
  - name: PlayerRegistered
    version: 1.0.0
    producer: auth-service
    consumers: [card-service, notification-service]
    payload:
      schema_version: string
      player_id: uuid
      provider: string
      rating: integer
      credits: integer
      initial_deck_size: integer
      initial_credits: integer
  - name: PlayerLoggedIn
    version: 1.0.0
    producer: auth-service
    consumers: [notification-service]
    payload:
      schema_version: string
      player_id: uuid
      provider: string
  - name: InitialOnboardingGranted
    producer: auth-service
    consumers: [card-service, economy-service, notification-service]
  - name: CardCreated
    producer: card-service
    consumers: [nft-service, economy-service, ranking-service]
  - name: MatchStarted
    producer: matchmaking-service
    consumers: [gameplay-service, notification-service]
  - name: RoundFinished
    producer: gameplay-service
    consumers: [ranking-service]
  - name: PlayerWonMatch
    producer: gameplay-service
    consumers: [ranking-service, economy-service, notification-service]
  - name: CreditsEarned
    producer: economy-service
    consumers: [notification-service]
  - name: CardExpired
    producer: card-service
    consumers: [economy-service, notification-service]
  - name: PlayerRankUpdated
    producer: ranking-service
    consumers: [notification-service]
  - name: TradeCreated
    producer: nft-service
    consumers: [economy-service, notification-service]
  - name: MarketplaceSaleCompleted
    producer: nft-service
    consumers: [economy-service, ranking-service, notification-service]
