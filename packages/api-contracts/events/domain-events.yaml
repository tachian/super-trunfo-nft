events:
  - name: PlayerRegistered
    version: 1.0.0
    producer: auth-service
    consumers: [card-service, notification-service]
    payload:
      schema_version: string
      player_id: uuid
      provider: string
      rating: integer
      credits: integer
      initial_deck_size: integer
      initial_credits: integer
  - name: PlayerLoggedIn
    version: 1.0.0
    producer: auth-service
    consumers: [notification-service]
    payload:
      schema_version: string
      player_id: uuid
      provider: string
  - name: InitialOnboardingGranted
    producer: auth-service
    consumers: [card-service, economy-service, notification-service]
  - name: CardCreated
    version: 1.0.0
    producer: card-service
    consumers: [nft-service, economy-service, ranking-service]
    payload:
      schema_version: string
      card_id: uuid
      owner_id: uuid
      name: string
      family: string
      rarity: integer
      level: integer
      uniqueness_hash: string
      expires_at: datetime
      generation_batch_id: uuid
  - name: DeckSelected
    version: 1.0.0
    producer: card-service
    consumers: [matchmaking-service, gameplay-service]
    payload:
      schema_version: string
      deck_id: uuid
      owner_id: uuid
      card_ids: uuid[]
      average_level: number
      selected_at: datetime
  - name: NftMetadataGenerated
    version: 1.0.0
    producer: nft-service
    consumers: [card-service, economy-service]
    payload:
      schema_version: string
      card_id: uuid
      metadata_uri: string
      image: string
      mint_enabled: boolean
      generated_at: datetime
  - name: MatchStarted
    version: 1.0.0
    producer: matchmaking-service
    consumers: [gameplay-service, notification-service]
    payload:
      schema_version: string
      match_id: uuid
      mode: string
      player_id: uuid
      opponent_id: uuid
      opponent_kind: string
      player_average_deck_level: integer
      opponent_average_deck_level: integer
      occurred_at: datetime
  - name: BotMatchCreated
    version: 1.0.0
    producer: matchmaking-service
    consumers: [gameplay-service, notification-service]
    payload:
      schema_version: string
      match_id: uuid
      player_id: uuid
      bot_id: uuid
      player_average_deck_level: integer
      bot_average_deck_level: integer
      occurred_at: datetime
  - name: RoundFinished
    version: 1.0.0
    producer: gameplay-service
    consumers: [ranking-service, notification-service]
    payload:
      schema_version: string
      match_id: uuid
      round_number: integer
      selected_attribute: string
      player_card_id: uuid
      opponent_card_id: uuid
      winner_id: uuid|null
      played_at: datetime
  - name: AttributeSelected
    version: 1.0.0
    producer: gameplay-service
    consumers: [notification-service]
    payload:
      schema_version: string
      match_id: uuid
      round_number: integer
      selected_attribute: string
      player_card_id: uuid
      opponent_card_id: uuid
      occurred_at: datetime
  - name: MatchResultUpdated
    version: 1.0.0
    producer: gameplay-service
    consumers: [ranking-service, notification-service]
    payload:
      schema_version: string
      match_id: uuid
      status: string
      winner_id: uuid|null
      player_score: integer
      opponent_score: integer
      occurred_at: datetime
  - name: PlayerWonMatch
    version: 1.0.0
    producer: gameplay-service
    consumers: [ranking-service, economy-service, notification-service]
    payload:
      schema_version: string
      match_id: uuid
      winner_id: uuid
      loser_id: uuid
      finished_at: datetime
  - name: CreditsEarned
    version: 1.0.0
    producer: economy-service
    consumers: [notification-service]
    payload:
      schema_version: string
      player_id: uuid
      match_id: uuid
      ledger_entry_id: uuid
      amount: integer
      balance: integer
      reason: string
      earned_at: datetime
  - name: OfferPurchased
    version: 1.0.0
    producer: economy-service
    consumers: [notification-service]
    payload:
      schema_version: string
      player_id: uuid
      offer_id: uuid
      purchase_id: uuid
      inventory_card_id: uuid
      card_id: uuid
      card_name: string
      price: integer
      balance: integer
      purchased_at: datetime
  - name: CardExpired
    producer: card-service
    consumers: [economy-service, notification-service]
  - name: PlayerRankUpdated
    version: 1.0.0
    producer: ranking-service
    consumers: [notification-service]
    payload:
      schema_version: string
      match_id: uuid
      player_id: uuid
      previous_score: integer
      score: integer
      delta: integer
      tier: string
      matches_played: integer
      wins: integer
      losses: integer
      updated_at: datetime
  - name: SeasonStarted
    version: 1.0.0
    producer: ranking-service
    consumers: [notification-service]
    payload:
      schema_version: string
      season_id: uuid
      name: string
      status: string
      starts_at: datetime
      ends_at: datetime
      duration_days: integer
      rating_reset_percentage: integer
      finished_at: datetime|null
  - name: SeasonFinished
    version: 1.0.0
    producer: ranking-service
    consumers: [economy-service, notification-service]
    payload:
      schema_version: string
      season_id: uuid
      name: string
      status: string
      starts_at: datetime
      ends_at: datetime
      duration_days: integer
      rating_reset_percentage: integer
      finished_at: datetime
      reset_ratings_count: integer
      reward_plan: object[]
  - name: MarketplaceListingCreated
    version: 1.0.0
    producer: nft-service
    consumers: [economy-service, notification-service]
    payload:
      schema_version: string
      listing_id: uuid
      seller_id: uuid
      card_id: uuid
      token_id: integer
      price: integer
      status: string
      expires_at: datetime
      created_at: datetime
  - name: TradeCreated
    version: 1.0.0
    producer: nft-service
    consumers: [economy-service, notification-service]
    payload:
      schema_version: string
      trade_id: uuid
      listing_id: uuid
      seller_id: uuid
      buyer_id: uuid
      card_id: uuid
      token_id: integer
      price: integer
      status: string
      created_at: datetime
  - name: TradeAccepted
    version: 1.0.0
    producer: nft-service
    consumers: [economy-service, ranking-service, notification-service]
    payload:
      schema_version: string
      trade_id: uuid
      listing_id: uuid
      seller_id: uuid
      buyer_id: uuid
      card_id: uuid
      token_id: integer
      price: integer
      status: string
      accepted_at: datetime
  - name: TradeCancelled
    version: 1.0.0
    producer: nft-service
    consumers: [economy-service, notification-service]
    payload:
      schema_version: string
      trade_id: uuid
      listing_id: uuid
      seller_id: uuid
      buyer_id: uuid
      card_id: uuid
      token_id: integer
      price: integer
      status: string
      cancelled_at: datetime
      cancellation_reason: string
  - name: NFTTransferred
    version: 1.0.0
    producer: nft-service
    consumers: [economy-service, ranking-service, notification-service]
    payload:
      schema_version: string
      trade_id: uuid
      listing_id: uuid
      card_id: uuid
      token_id: integer
      from_player_id: uuid
      to_player_id: uuid
      transferred_at: datetime
  - name: MarketplaceSaleCompleted
    producer: nft-service
    consumers: [economy-service, ranking-service, notification-service]
  - name: FriendInviteSent
    version: 1.0.0
    producer: social-service
    consumers: [notification-service]
    payload:
      schema_version: string
      invite_id: uuid
      requester_id: uuid
      addressee_id: uuid
      status: string
      created_at: datetime
  - name: FriendInviteAccepted
    version: 1.0.0
    producer: social-service
    consumers: [ranking-service, notification-service]
    payload:
      schema_version: string
      invite_id: uuid
      requester_id: uuid
      addressee_id: uuid
      friendship_id: uuid
      status: string
      responded_at: datetime
  - name: FriendInviteRejected
    version: 1.0.0
    producer: social-service
    consumers: [notification-service]
    payload:
      schema_version: string
      invite_id: uuid
      requester_id: uuid
      addressee_id: uuid
      status: string
      responded_at: datetime
  - name: NotificationQueued
    version: 1.0.0
    producer: notification-service
    consumers: [web, mobile]
    payload:
      schema_version: string
      notification_id: uuid
      player_id: uuid
      topic: string
      channel: string
      status: string
      title: string
      source_event_id: string|null
      created_at: datetime
      delivered_at: datetime|null
  - name: NotificationDelivered
    version: 1.0.0
    producer: notification-service
    consumers: [analytics]
    payload:
      schema_version: string
      notification_id: uuid
      player_id: uuid
      topic: string
      channel: string
      status: string
      title: string
      source_event_id: string|null
      created_at: datetime
      delivered_at: datetime
