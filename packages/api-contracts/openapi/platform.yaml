openapi: 3.1.0
info:
  title: Super Trunfo Platform API
  version: 0.1.0
  description: Aggregated MVP API surface for service contracts.
paths:
  /auth/login:
    post:
      summary: Authenticate player
      operationId: loginPlayer
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPlayerRequest"
      responses:
        "200":
          description: Player authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/register:
    post:
      summary: Register player
      operationId: registerPlayer
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPlayerRequest"
      responses:
        "201":
          description: Player registered and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email or nickname already registered
  /players/me:
    get:
      summary: Get current player profile
      operationId: getCurrentPlayerProfile
      tags: [Identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "401":
          description: Invalid or missing bearer token
  /cards:
    get:
      summary: List player cards
      tags: [Cards]
      responses:
        "202":
          description: Planned endpoint
  /cards/{id}:
    get:
      summary: Get card details
      tags: [Cards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Planned endpoint
  /cards/select-deck:
    post:
      summary: Select active deck
      tags: [Cards]
      responses:
        "202":
          description: Planned endpoint
  /matchmaking/find:
    post:
      summary: Find PvP opponent or create PvE match
      tags: [Matchmaking]
      responses:
        "202":
          description: Planned endpoint
  /match/{id}:
    get:
      summary: Get match state
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Planned endpoint
  /match/{id}/play:
    post:
      summary: Play a round
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Planned endpoint
  /shop/offers:
    get:
      summary: List shop offers
      tags: [Economy]
      responses:
        "202":
          description: Planned endpoint
  /shop/buy:
    post:
      summary: Buy a card or pack
      tags: [Economy]
      responses:
        "202":
          description: Planned endpoint
  /ranking/global:
    get:
      summary: Global leaderboard
      tags: [Ranking]
      responses:
        "202":
          description: Planned endpoint
  /ranking/friends:
    get:
      summary: Friends leaderboard
      tags: [Ranking]
      responses:
        "202":
          description: Planned endpoint
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, player]
      properties:
        access_token:
          type: string
          description: Signed JWT access token.
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          minimum: 1
        player:
          $ref: "#/components/schemas/PlayerSummary"
    LoginPlayerRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    PlayerSummary:
      type: object
      required: [id, nickname, rating, credits]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        rating:
          type: integer
        credits:
          type: integer
    PlayerProfile:
      allOf:
        - $ref: "#/components/schemas/PlayerSummary"
        - type: object
          required: [created_at, social_login]
          properties:
            created_at:
              type: string
              format: date-time
            social_login:
              $ref: "#/components/schemas/SocialLoginMetadata"
    RegisterPlayerRequest:
      type: object
      required: [nickname, email, password]
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    SocialLoginMetadata:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [credentials, google, apple, facebook]
        subject:
          type:
            - string
            - "null"
