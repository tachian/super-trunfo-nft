openapi: 3.1.0
info:
  title: Super Trunfo Platform API
  version: 0.1.0
  description: Aggregated MVP API surface for service contracts.
paths:
  /auth/login:
    post:
      summary: Authenticate player
      operationId: loginPlayer
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPlayerRequest"
      responses:
        "200":
          description: Player authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/register:
    post:
      summary: Register player
      operationId: registerPlayer
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPlayerRequest"
      responses:
        "201":
          description: Player registered and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email or nickname already registered
  /players/me:
    get:
      summary: Get current player profile
      operationId: getCurrentPlayerProfile
      tags: [Identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "401":
          description: Invalid or missing bearer token
  /cards:
    get:
      summary: List player cards
      tags: [Cards]
      responses:
        "202":
          description: Planned endpoint
  /cards/{id}:
    get:
      summary: Get card details
      tags: [Cards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Planned endpoint
  /cards/select-deck:
    post:
      summary: Select active deck
      operationId: selectDeck
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectDeckRequest"
      responses:
        "200":
          description: Active deck selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: Invalid deck selection
        "404":
          description: Selected card not found
  /matchmaking/find:
    post:
      summary: Find PvP opponent or create PvE match
      operationId: findMatch
      tags: [Matchmaking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindMatchRequest"
      responses:
        "202":
          description: Matchmaking ticket queued or matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindMatchResponse"
  /matchmaking/queues:
    get:
      summary: Get matchmaking tier queues
      operationId: getMatchmakingQueues
      tags: [Matchmaking]
      responses:
        "200":
          description: Redis tier queues configured for matchmaking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchmakingQueues"
  /match/{id}:
    get:
      summary: Get match state
      operationId: getMatchState
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Match state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameplayMatch"
        "404":
          description: Match not found
  /match/{id}/play:
    post:
      summary: Play a round
      operationId: playRound
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayRoundRequest"
      responses:
        "200":
          description: Updated authoritative match state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameplayMatch"
        "400":
          description: Invalid round play
        "404":
          description: Match not found
        "422":
          description: Invalid payload or forbidden client-side score mutation
  /match/{id}/replay:
    get:
      summary: Get match replay
      operationId: getMatchReplay
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authoritative match replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReplay"
        "404":
          description: Match not found
  /match/{id}/events:
    get:
      summary: Stream realtime match events
      operationId: streamMatchEvents
      tags: [Gameplay]
      x-websocket: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: WebSocket stream for round, result and ranking events
  /shop/offers:
    get:
      summary: List shop offers
      operationId: listShopOffers
      tags: [Economy]
      responses:
        "200":
          description: Active card shop offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOffersResponse"
  /shop/buy:
    post:
      summary: Buy a card or pack
      operationId: buyShopOffer
      tags: [Economy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyShopOfferRequest"
      responses:
        "201":
          description: Shop offer purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyShopOfferResponse"
        "404":
          description: Wallet or shop offer not found
        "409":
          description: Shop offer cannot be purchased
  /economy/telemetry:
    get:
      summary: Get economic telemetry metrics
      operationId: getEconomicTelemetry
      tags: [Economy]
      responses:
        "200":
          description: Aggregated economy telemetry for operators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomicTelemetryResponse"
  /wallet/credits:
    get:
      summary: Get wallet credit balance
      operationId: getWalletCredits
      tags: [Economy]
      parameters:
        - name: player_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wallet credit balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyWalletCredits"
        "404":
          description: Wallet not found
  /wallet/credits/match-result:
    post:
      summary: Apply credits from match result
      operationId: applyMatchResultCredits
      tags: [Economy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyMatchResultCreditsRequest"
      responses:
        "201":
          description: Credits applied from match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyMatchResultCreditsResponse"
  /ranking/global:
    get:
      summary: Global leaderboard
      operationId: getGlobalRanking
      tags: [Ranking]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Cached global leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingLeaderboardResponse"
  /ranking/friends:
    get:
      summary: Friends leaderboard
      operationId: getFriendsRanking
      tags: [Ranking]
      parameters:
        - name: player_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: friend_ids
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Cached friends leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingLeaderboardResponse"
  /ranking/recalculate:
    post:
      summary: Recalculate player ratings after a match
      operationId: recalculatePlayerRating
      tags: [Ranking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecalculatePlayerRatingRequest"
      responses:
        "201":
          description: Winner and loser ratings recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalculatePlayerRatingResponse"
        "400":
          description: Invalid ranking recalculation
  /friends:
    get:
      summary: List player friends
      operationId: listFriends
      tags: [Social]
      parameters:
        - name: player_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Player friendships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsResponse"
  /friends/invite:
    post:
      summary: Send a friend invite
      operationId: sendFriendInvite
      tags: [Social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendInviteRequest"
      responses:
        "201":
          description: Friend invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendInviteActionResponse"
        "400":
          description: Invalid friend invite
  /friends/invite/{invite_id}/accept:
    post:
      summary: Accept a friend invite
      operationId: acceptFriendInvite
      tags: [Social]
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerFriendInviteRequest"
      responses:
        "200":
          description: Friend invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendInviteActionResponse"
        "400":
          description: Friend invite cannot be accepted
        "404":
          description: Friend invite not found
  /friends/invite/{invite_id}/reject:
    post:
      summary: Reject a friend invite
      operationId: rejectFriendInvite
      tags: [Social]
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerFriendInviteRequest"
      responses:
        "200":
          description: Friend invite rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendInviteActionResponse"
        "400":
          description: Friend invite cannot be rejected
        "404":
          description: Friend invite not found
  /notifications:
    get:
      summary: List player notifications
      operationId: listNotifications
      tags: [Notification]
      parameters:
        - name: player_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Player notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
  /notifications/push:
    post:
      summary: Queue a push or in-app notification
      operationId: queueNotification
      tags: [Notification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueNotificationRequest"
      responses:
        "201":
          description: Notification queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationActionResponse"
        "400":
          description: Invalid notification
  /notifications/events:
    post:
      summary: Queue a notification from a domain event
      operationId: queueNotificationFromEvent
      tags: [Notification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueNotificationFromEventRequest"
      responses:
        "201":
          description: Notification queued from event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationActionResponse"
        "400":
          description: Unsupported notification event
  /notifications/{notification_id}/delivered:
    post:
      summary: Mark a notification as delivered
      operationId: markNotificationDelivered
      tags: [Notification]
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationActionResponse"
        "400":
          description: Notification cannot be delivered
        "404":
          description: Notification not found
  /nft/metadata/offline:
    post:
      summary: Generate offline ERC-721 metadata for a card
      operationId: generateOfflineNftMetadata
      tags: [NFT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateNftMetadataRequest"
      responses:
        "201":
          description: Offline NFT metadata generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftMetadata"
  /nft/metadata/{card_id}:
    get:
      summary: Get offline ERC-721 metadata for a card
      operationId: getNftMetadata
      tags: [NFT]
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Offline NFT metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftMetadata"
        "404":
          description: Offline NFT metadata not found
  /nft/mint:
    post:
      summary: Mint card NFT on-chain
      tags: [NFT]
      responses:
        "202":
          description: NFT mint feature flag status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftMintFeatureFlagResponse"
  /marketplace/listings:
    post:
      summary: Create a marketplace listing for an NFT card
      operationId: createMarketplaceListing
      tags: [Marketplace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketplaceListingRequest"
      responses:
        "201":
          description: Marketplace listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "400":
          description: Invalid marketplace listing
    get:
      summary: List active marketplace listings
      operationId: listMarketplaceListings
      tags: [Marketplace]
      responses:
        "200":
          description: Active marketplace listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceListing"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, player, onboarding]
      properties:
        access_token:
          type: string
          description: Signed JWT access token.
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          minimum: 1
        player:
          $ref: "#/components/schemas/PlayerSummary"
        onboarding:
          $ref: "#/components/schemas/OnboardingRewards"
    CreditLedgerEntry:
      type: object
      required: [id, amount, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
        reason:
          type: string
          enum: [initial_deck_tenth_card_credit]
        created_at:
          type: string
          format: date-time
    Card:
      type: object
      required:
        [id, owner_id, attributes, family, level, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/CardAttributes"
        family:
          type: string
          minLength: 1
        level:
          type: integer
          description: Derived from speed + strength + intelligence + resistance + rarity.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CardAttributes:
      type: object
      required: [name, speed, strength, intelligence, resistance, rarity]
      properties:
        name:
          type: string
          minLength: 1
        speed:
          type: integer
          minimum: 0
          maximum: 100
        strength:
          type: integer
          minimum: 0
          maximum: 100
        intelligence:
          type: integer
          minimum: 0
          maximum: 100
        resistance:
          type: integer
          minimum: 0
          maximum: 100
        rarity:
          type: integer
          minimum: 0
          maximum: 100
    Deck:
      type: object
      required: [id, owner_id, card_ids, average_level, selected_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        card_ids:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        average_level:
          type: number
          description: Average level of the 10 selected valid cards.
        selected_at:
          type: string
          format: date-time
    InitialDeckCard:
      type: object
      required:
        - id
        - name
        - family
        - rarity_label
        - speed
        - strength
        - intelligence
        - resistance
        - rarity
        - level
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        family:
          type: string
        rarity_label:
          type: string
          enum: [common, rare, epic]
        speed:
          type: integer
          minimum: 45
          maximum: 72
        strength:
          type: integer
          minimum: 45
          maximum: 72
        intelligence:
          type: integer
          minimum: 45
          maximum: 72
        resistance:
          type: integer
          minimum: 45
          maximum: 72
        rarity:
          type: integer
          minimum: 50
          maximum: 70
        level:
          type: integer
        expires_at:
          type: string
          format: date-time
    GameplayMatch:
      type: object
      required:
        - id
        - player
        - opponent
        - rounds
        - score
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        player:
          $ref: "#/components/schemas/GameplayParticipant"
        opponent:
          $ref: "#/components/schemas/GameplayParticipant"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/GameplayRound"
        score:
          $ref: "#/components/schemas/GameplayScore"
        status:
          type: string
          enum: [in_progress, finished, abandoned]
        winner_id:
          type:
            - string
            - "null"
          format: uuid
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
    GameplayParticipant:
      type: object
      required: [id, kind, deck_card_ids]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [player, bot]
        deck_card_ids:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    GameplayRound:
      type: object
      required:
        - number
        - player_card_id
        - opponent_card_id
        - selected_attribute
        - played_at
      properties:
        number:
          type: integer
          minimum: 1
        player_card_id:
          type: string
          format: uuid
        opponent_card_id:
          type: string
          format: uuid
        selected_attribute:
          type: string
          enum: [speed, strength, intelligence, resistance, rarity]
        winner_id:
          type:
            - string
            - "null"
          format: uuid
        played_at:
          type: string
          format: date-time
    GameplayScore:
      type: object
      required: [player, opponent]
      properties:
        player:
          type: integer
          minimum: 0
        opponent:
          type: integer
          minimum: 0
    MatchReplay:
      type: object
      required: [match_id, rounds]
      properties:
        match_id:
          type: string
          format: uuid
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/GameplayRound"
    GameplayRealtimeEvent:
      type: object
      required: [id, name, schema_version, match_id, payload, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum:
            [
              AttributeSelected,
              RoundFinished,
              MatchResultUpdated,
              PlayerRankUpdated,
            ]
        schema_version:
          type: string
          enum: [1.0.0]
        match_id:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
    PlayRoundRequest:
      type: object
      additionalProperties: false
      required: [player_card_id, opponent_card_id, selected_attribute]
      properties:
        player_card_id:
          type: string
          format: uuid
        opponent_card_id:
          type: string
          format: uuid
        selected_attribute:
          type: string
          enum: [speed, strength, intelligence, resistance, rarity]
    EconomyCreditLedgerEntry:
      type: object
      required: [id, player_id, match_id, amount, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 0
        reason:
          type: string
          enum: [match_victory, match_defeat]
        created_at:
          type: string
          format: date-time
    EconomyEvent:
      type: object
      required: [name, aggregate_id, payload, occurred_at, event_id]
      properties:
        name:
          type: string
          enum: [CreditsEarned, OfferPurchased]
        aggregate_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
        event_id:
          type: string
          format: uuid
    ShopOfferResponse:
      type: object
      required: [id, card_id, card_name, family, rarity, price, expires_at]
      properties:
        id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        card_name:
          type: string
          minLength: 1
        family:
          type: string
          minLength: 1
        rarity:
          type: integer
          minimum: 0
          maximum: 100
        price:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
    ShopOffersResponse:
      type: object
      required: [service, task, offers]
      properties:
        service:
          type: string
          enum: [economy-service]
        task:
          type: string
          enum: [ST-502]
        offers:
          type: array
          items:
            $ref: "#/components/schemas/ShopOfferResponse"
    BuyShopOfferRequest:
      type: object
      required: [player_id, offer_id]
      properties:
        player_id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
    EconomyPurchase:
      type: object
      required: [id, player_id, offer_id, card_id, price, purchased_at]
      properties:
        id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        price:
          type: integer
          minimum: 1
        purchased_at:
          type: string
          format: date-time
    EconomyInventoryCard:
      type: object
      required: [id, player_id, card_id, source_offer_id, acquired_at]
      properties:
