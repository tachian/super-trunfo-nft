openapi: 3.1.0
info:
  title: Super Trunfo Platform API
  version: 0.1.0
  description: Aggregated MVP API surface for service contracts.
paths:
  /auth/login:
    post:
      summary: Authenticate player
      operationId: loginPlayer
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPlayerRequest"
      responses:
        "200":
          description: Player authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/register:
    post:
      summary: Register player
      operationId: registerPlayer
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPlayerRequest"
      responses:
        "201":
          description: Player registered and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email or nickname already registered
  /players/me:
    get:
      summary: Get current player profile
      operationId: getCurrentPlayerProfile
      tags: [Identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "401":
          description: Invalid or missing bearer token
  /cards:
    get:
      summary: List player cards
      tags: [Cards]
      responses:
        "202":
          description: Planned endpoint
  /cards/{id}:
    get:
      summary: Get card details
      tags: [Cards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Planned endpoint
  /cards/select-deck:
    post:
      summary: Select active deck
      operationId: selectDeck
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectDeckRequest"
      responses:
        "200":
          description: Active deck selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: Invalid deck selection
        "404":
          description: Selected card not found
  /matchmaking/find:
    post:
      summary: Find PvP opponent or create PvE match
      tags: [Matchmaking]
      responses:
        "202":
          description: Planned endpoint
  /matchmaking/queues:
    get:
      summary: Get matchmaking tier queues
      operationId: getMatchmakingQueues
      tags: [Matchmaking]
      responses:
        "200":
          description: Redis tier queues configured for matchmaking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchmakingQueues"
  /match/{id}:
    get:
      summary: Get match state
      operationId: getMatchState
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Match state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameplayMatch"
        "404":
          description: Match not found
  /match/{id}/play:
    post:
      summary: Play a round
      operationId: playRound
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayRoundRequest"
      responses:
        "200":
          description: Updated authoritative match state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameplayMatch"
        "400":
          description: Invalid round play
        "404":
          description: Match not found
        "422":
          description: Invalid payload or forbidden client-side score mutation
  /match/{id}/replay:
    get:
      summary: Get match replay
      operationId: getMatchReplay
      tags: [Gameplay]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authoritative match replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReplay"
        "404":
          description: Match not found
  /shop/offers:
    get:
      summary: List shop offers
      tags: [Economy]
      responses:
        "202":
          description: Planned endpoint
  /shop/buy:
    post:
      summary: Buy a card or pack
      tags: [Economy]
      responses:
        "202":
          description: Planned endpoint
  /ranking/global:
    get:
      summary: Global leaderboard
      tags: [Ranking]
      responses:
        "202":
          description: Planned endpoint
  /ranking/friends:
    get:
      summary: Friends leaderboard
      tags: [Ranking]
      responses:
        "202":
          description: Planned endpoint
  /nft/metadata/offline:
    post:
      summary: Generate offline ERC-721 metadata for a card
      operationId: generateOfflineNftMetadata
      tags: [NFT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateNftMetadataRequest"
      responses:
        "201":
          description: Offline NFT metadata generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftMetadata"
  /nft/metadata/{card_id}:
    get:
      summary: Get offline ERC-721 metadata for a card
      operationId: getNftMetadata
      tags: [NFT]
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Offline NFT metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftMetadata"
        "404":
          description: Offline NFT metadata not found
  /nft/mint:
    post:
      summary: Mint card NFT on-chain
      tags: [NFT]
      responses:
        "202":
          description: Disabled until post-MVP
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, player, onboarding]
      properties:
        access_token:
          type: string
          description: Signed JWT access token.
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          minimum: 1
        player:
          $ref: "#/components/schemas/PlayerSummary"
        onboarding:
          $ref: "#/components/schemas/OnboardingRewards"
    CreditLedgerEntry:
      type: object
      required: [id, amount, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
        reason:
          type: string
          enum: [initial_deck_tenth_card_credit]
        created_at:
          type: string
          format: date-time
    Card:
      type: object
      required:
        [id, owner_id, attributes, family, level, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/CardAttributes"
        family:
          type: string
          minLength: 1
        level:
          type: integer
          description: Derived from speed + strength + intelligence + resistance + rarity.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CardAttributes:
      type: object
      required: [name, speed, strength, intelligence, resistance, rarity]
      properties:
        name:
          type: string
          minLength: 1
        speed:
          type: integer
          minimum: 0
          maximum: 100
        strength:
          type: integer
          minimum: 0
          maximum: 100
        intelligence:
          type: integer
          minimum: 0
          maximum: 100
        resistance:
          type: integer
          minimum: 0
          maximum: 100
        rarity:
          type: integer
          minimum: 0
          maximum: 100
    Deck:
      type: object
      required: [id, owner_id, card_ids, average_level, selected_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        card_ids:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        average_level:
          type: number
          description: Average level of the 10 selected valid cards.
        selected_at:
          type: string
          format: date-time
    InitialDeckCard:
      type: object
      required:
        - id
        - name
        - family
        - rarity_label
        - speed
        - strength
        - intelligence
        - resistance
        - rarity
        - level
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        family:
          type: string
        rarity_label:
          type: string
          enum: [common, rare, epic]
        speed:
          type: integer
          minimum: 45
          maximum: 72
        strength:
          type: integer
          minimum: 45
          maximum: 72
        intelligence:
          type: integer
          minimum: 45
          maximum: 72
        resistance:
          type: integer
          minimum: 45
          maximum: 72
        rarity:
          type: integer
          minimum: 50
          maximum: 70
        level:
          type: integer
        expires_at:
          type: string
          format: date-time
    GameplayMatch:
      type: object
      required:
        - id
        - player
        - opponent
        - rounds
        - score
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        player:
          $ref: "#/components/schemas/GameplayParticipant"
        opponent:
          $ref: "#/components/schemas/GameplayParticipant"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/GameplayRound"
        score:
          $ref: "#/components/schemas/GameplayScore"
        status:
          type: string
          enum: [in_progress, finished, abandoned]
        winner_id:
          type:
            - string
            - "null"
          format: uuid
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
    GameplayParticipant:
      type: object
      required: [id, kind, deck_card_ids]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [player, bot]
        deck_card_ids:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    GameplayRound:
      type: object
      required:
        - number
        - player_card_id
        - opponent_card_id
        - selected_attribute
        - played_at
      properties:
        number:
          type: integer
          minimum: 1
        player_card_id:
          type: string
          format: uuid
        opponent_card_id:
          type: string
          format: uuid
        selected_attribute:
          type: string
          enum: [speed, strength, intelligence, resistance, rarity]
        winner_id:
          type:
            - string
            - "null"
          format: uuid
        played_at:
          type: string
          format: date-time
    GameplayScore:
      type: object
      required: [player, opponent]
      properties:
        player:
          type: integer
          minimum: 0
        opponent:
          type: integer
          minimum: 0
    MatchReplay:
      type: object
      required: [match_id, rounds]
      properties:
        match_id:
          type: string
          format: uuid
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/GameplayRound"
    PlayRoundRequest:
      type: object
      additionalProperties: false
      required: [player_card_id, opponent_card_id, selected_attribute]
      properties:
        player_card_id:
          type: string
          format: uuid
        opponent_card_id:
          type: string
          format: uuid
        selected_attribute:
          type: string
          enum: [speed, strength, intelligence, resistance, rarity]
    MatchmakingQueue:
      type: object
      required: [tier, name, size]
      properties:
        tier:
          type: string
          enum: [bronze, silver, gold]
        name:
          type: string
          enum: [queue:bronze, queue:silver, queue:gold]
        size:
          type: integer
          minimum: 0
    MatchmakingQueues:
      type: object
      required: [service, task, backend, queues]
      properties:
        service:
          type: string
          enum: [matchmaking-service]
        task:
          type: string
          enum: [ST-401]
        backend:
          type: string
          enum: [redis]
        queues:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/MatchmakingQueue"
    LoginPlayerRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    PlayerSummary:
      type: object
      required: [id, nickname, rating, credits]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        rating:
          type: integer
        credits:
          type: integer
    PlayerProfile:
      allOf:
        - $ref: "#/components/schemas/PlayerSummary"
        - type: object
          required: [created_at, social_login, onboarding]
          properties:
            created_at:
              type: string
              format: date-time
            social_login:
              $ref: "#/components/schemas/SocialLoginMetadata"
            onboarding:
              $ref: "#/components/schemas/OnboardingRewards"
    OnboardingRewards:
      type: object
      required: [initial_deck, initial_credits, credit_ledger, granted_at]
      properties:
        initial_deck:
          type: array
          minItems: 9
          maxItems: 9
          items:
            $ref: "#/components/schemas/InitialDeckCard"
        initial_credits:
          type: integer
          enum: [1]
        credit_ledger:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreditLedgerEntry"
        granted_at:
          type: string
          format: date-time
    RegisterPlayerRequest:
      type: object
      required: [nickname, email, password]
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    SelectDeckRequest:
      type: object
      required: [owner_id, card_ids]
      properties:
        owner_id:
          type: string
          format: uuid
        card_ids:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    SocialLoginMetadata:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [credentials, google, apple, facebook]
        subject:
          type:
            - string
            - "null"
    GenerateNftMetadataRequest:
      type: object
      required: [card_id, name, family, rarity, level]
      properties:
        card_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        family:
          type: string
          minLength: 1
          maxLength: 50
        rarity:
          type: integer
          minimum: 0
          maximum: 100
        level:
          type: integer
          minimum: 0
        speed:
          type: integer
          minimum: 0
          maximum: 100
        strength:
          type: integer
          minimum: 0
          maximum: 100
        intelligence:
          type: integer
          minimum: 0
          maximum: 100
        resistance:
          type: integer
          minimum: 0
          maximum: 100
        expires_at:
          type: string
          format: date-time
    NftAttribute:
      type: object
      required: [trait_type, value]
      properties:
        trait_type:
          type: string
          minLength: 1
        value:
          oneOf:
            - type: string
            - type: integer
    NftMetadata:
      type: object
      required: [name, description, image, attributes, properties]
      properties:
        name:
          type: string
          description: ERC-721 metadata name.
        description:
          type: string
          description: ERC-721 metadata description.
        image:
          type: string
          description: ERC-721 metadata image URI. Uses IPFS in the MVP offline flow.
        attributes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NftAttribute"
        properties:
          type: object
          required: [card_id, metadata_uri, generated_at, mint_enabled]
          properties:
            card_id:
              type: string
              format: uuid
            metadata_uri:
              type: string
            generated_at:
              type: string
              format: date-time
            mint_enabled:
              type: boolean
              enum: [false]
