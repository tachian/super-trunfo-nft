name: Project task
description: Task from the Super Trunfo delivery plan
title: "ST-000: "
labels: ["task"]
body:
  - type: input
    id: sprint
    attributes:
      label: Sprint
      placeholder: Sprint 0
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Epic
      placeholder: EP-01
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: List observable outcomes for this task.
    validations:
      required: true
