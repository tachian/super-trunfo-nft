name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  contracts:
    name: API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @super-trunfo/api-contracts test

  python-shared:
    name: Python shared kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/services/requirements-dev.txt
      - run: ruff check apps/services packages/python
      - run: python -m compileall apps/services packages/python
      - run: pytest packages/python/super-trunfo-shared/tests
        env:
          PYTHONPATH: packages/python/super-trunfo-shared/src

  service-tests:
    name: Service tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - card-service
          - matchmaking-service
          - gameplay-service
          - economy-service
          - ranking-service
          - nft-service
          - social-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/services/requirements-dev.txt
      - run: pip install ./packages/python/super-trunfo-shared
      - run: pytest apps/services/${{ matrix.service }}/tests
        env:
          PYTHONPATH: apps/services/${{ matrix.service }}/src

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @super-trunfo/web lint
      - run: pnpm --filter @super-trunfo/web test
      - run: pnpm --filter @super-trunfo/web build

  smart-contracts:
    name: Smart contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @super-trunfo/smart-contracts test

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test

  docker-build:
    name: Docker build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - card-service
          - matchmaking-service
          - gameplay-service
          - economy-service
          - ranking-service
          - nft-service
          - social-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/fastapi-service.Dockerfile
          push: false
          build-args: |
            SERVICE_DIR=apps/services/${{ matrix.service }}
          tags: super-trunfo/${{ matrix.service }}:ci

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: terraform init -backend=false
      - working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: terraform validate

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@v3
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
