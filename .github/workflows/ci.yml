name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  workspace-quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm quality:duplicates
      - run: pnpm --filter @super-trunfo/api-contracts test
      - run: pnpm services:list
      - run: pnpm local:check

  python:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/services/requirements-dev.txt
      - run: ruff check apps/services packages/python
      - run: python -m compileall apps/services packages/python
      - run: pnpm python:test
      - run: pnpm matchmaking:load-test

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @super-trunfo/web lint
      - run: pnpm --filter @super-trunfo/web test
      - run: pnpm --filter @super-trunfo/web build

  smart-contracts:
    name: Smart contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @super-trunfo/smart-contracts test

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test

  docker-build:
    name: Docker build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - card-service
          - matchmaking-service
          - gameplay-service
          - economy-service
          - ranking-service
          - nft-service
          - social-service
          - notification-service
    steps:
      - uses: actions/checkout@v6
      - name: Build service image
        run: |
          docker build \
            --file infra/docker/fastapi-service.Dockerfile \
            --build-arg SERVICE_DIR=apps/services/${{ matrix.service }} \
            --tag super-trunfo/${{ matrix.service }}:ci \
            .

  docker-build-web:
    name: Docker build - web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build web image
        run: |
          docker build \
            --file infra/docker/web.Dockerfile \
            --tag super-trunfo/web:ci \
            .

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: terraform init -backend=false
      - working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: terraform validate

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v4
      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - name: Enforce Trivy vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/services/requirements-dev.txt
      - run: PYTHON_COVERAGE=1 pnpm python:test
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
